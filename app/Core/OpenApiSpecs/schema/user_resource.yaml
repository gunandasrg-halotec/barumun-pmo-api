type: object
properties:
  id:
    type: string
  full_name:
    type: string
  email:
    type: string
    format: email
  is_active:
    type: boolean
  phone:
    type: string 
  last_login_at:
    type: string
    format: date-time
  role:
    type: object
    properties:
      id:
        type: string
      name:
        type: string
        format: name
      code:
        type: string
        enum:
          [
            ADMINISTRATOR_SISTEM,
            PROJECT_MANAGER,
            DIREKSI,
            FINANCE,
            ADMIN_PROYEK,
            ]
  created_at:
    type: string
    format: date-time
