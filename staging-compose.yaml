services:
  # Single Service: Handles Nginx, PHP, and Vite
  web:
    build:
      context: .
      dockerfile: docker/staging/Dockerfile
    image: pmo/backend:dev
    container_name: pmo-backend-dev
    restart: unless-stopped
    tty: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - docker/staging/.env.dev
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
       - /home/ezra/projects/pmo-files:/var/www/html/storage/app/private
    networks:
      - pmo-backend-network

